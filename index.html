<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seleção Brasileira</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:#063b25;color:white;text-align:center
}
header{
height:100vh;
display:flex;align-items:center;justify-content:center;
background:linear-gradient(#006b3ccc,#00351dcc),
url("https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1600&q=80") center/cover
}
h1{font-size:clamp(45px,8vw,80px);color:#ffdf00}
p{font-size:20px;margin:20px}
button{
padding:14px 28px;border:0;border-radius:25px;
background:#ffdf00;color:#063b25;
font-weight:bold;font-size:16px
}
section{padding:60px 20px}
h2{color:#ffdf00;font-size:35px;margin-bottom:25px}
.card{
display:inline-block;background:#0a5132;
padding:25px;margin:10px;
border-radius:15px;width:200px
}
.card div{font-size:50px;margin-bottom:10px}
footer{padding:25px;background:#032016;color:#aaa}
</style>
</head>

<body>
<header>
<div>
<h1>🇧🇷 BRASIL</h1>
<p>Seleção Brasileira de Futebol</p>
<button>VAMOS, BRASIL!</button>
</div>
</header>

<section>
<h2>🏆 A Seleção</h2>
<p>Uma das maiores seleções da história do futebol.</p>

<div class="card">
<div>⚽</div>
<h3>Futebol</h3>
</div>

<div class="card">
<div>🏆</div>
<h3>5 Copas</h3>
</div>

<div class="card">
<div>🇧🇷</div>
<h3>Canarinho</h3>
</div>
</section>

<footer>
Brasil acima de tudo no futebol 💚💛
</footer>
</body>
</html>
