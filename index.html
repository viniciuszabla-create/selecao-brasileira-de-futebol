<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        h1 {
            font-size: 45px;
            color: #e91e63;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            color: #555;
        }

        .reacoes {
            margin-top: 30px;
        }

        button {
            font-size: 25px;
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 15px;
            background-color: white;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: scale(1.1);
            background-color: #ffe4ef;
        }

        span {
            font-weight: bold;
            color: #e91e63;
        }
    </style>
</head>

<body>

    <h1>❤️ Reações do nosso Blog ❤️</h1>

    <p>Gostou da nossa página? Escolha uma reação!</p>

    <div class="reacoes">
        <button>❤️ <span>0</span></button>
        <button>👍 <span>0</span></button>
        <button>😍 <span>0</span></button>
    </div>

    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach(function(botao) {

            botao.addEventListener("click", botaoClicado);

            function botaoClicado() {
                let texto = botao.querySelector("span");
                texto.textContent++;
            }

        });
    </script>

</body>
</html>
